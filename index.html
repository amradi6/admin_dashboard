<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة إدارة مسار العلم</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">مسار العلم</p>
        <h1>لوحة الإدارة</h1>
      </div>
      <button id="refresh" class="button secondary">تحديث البيانات</button>
    </header>
    <section id="message" class="message hidden"></section>
    <nav class="tabs" aria-label="أقسام الإدارة">
      <button class="tab active" data-section="students">الطالبات</button>
      <button class="tab" data-section="guardians">أولياء الأمور</button>
      <button class="tab" data-section="instructors">المعلمات</button>
    </nav>
    <section class="content">
      <div class="section-head">
        <div>
          <h2 id="section-title">الطالبات</h2>
          <p id="section-subtitle">إدارة بيانات الطالبات المسجلة.</p>
        </div>
        <button id="add" class="button primary">إضافة</button>
      </div>
      <div id="loading" class="loading">جارٍ تحميل البيانات...</div>
      <div id="empty" class="empty hidden">لا توجد بيانات بعد. استخدمي زر «إضافة» لإنشاء أول سجل.</div>
      <div id="table-wrap" class="table-wrap hidden"></div>
    </section>
  </main>
  <dialog id="editor">
    <form method="dialog" id="editor-form">
      <h2 id="editor-title">إضافة سجل</h2>
      <div id="fields"></div>
      <div class="dialog-actions">
        <button value="cancel" class="button secondary">إلغاء</button>
        <button value="save" class="button primary">حفظ</button>
      </div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
